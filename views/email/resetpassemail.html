<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body style="margin: 0; font-family: Arial, sans-serif; background: #f4f6f8">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 0">
      <tr>
        <td align="center">
          <table
            width="450"
            style="background: #fff; border-radius: 12px; padding: 30px"
          >
            <tr>
              <td align="center">
                <h2 style="color: #e53935">Reset Password</h2>
              </td>
            </tr>

            <tr>
              <td style="padding: 20px 0; color: #555">
                Hi <strong>{{name}}</strong>,<br /><br />
                You requested to reset your password. Click the button below:
              </td>
            </tr>

            <tr>
              <td align="center">
                <a
                  href="{{url}}"
                  style="
                    background: #e53935;
                    color: #fff;
                    padding: 12px 25px;
                    text-decoration: none;
                    border-radius: 6px;
                    font-weight: bold;
                  "
                >
                  Reset Password
                </a>
              </td>
            </tr>

            <tr>
              <td style="padding-top: 20px; font-size: 13px; color: #888">
                This link will expire in 10 minutes.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
