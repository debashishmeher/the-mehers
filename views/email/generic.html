<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body style="margin: 0; font-family: Arial, sans-serif; background: #f4f6f8">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 0">
      <tr>
        <td align="center">
          <table
            width="450"
            style="background: #fff; border-radius: 12px; padding: 30px"
          >
            <tr>
              <td align="center">
                <h2 style="color: #333">{{subject}}</h2>
              </td>
            </tr>

            <tr>
              <td style="padding: 20px 0; color: #555">
                Hello <strong>{{name}}</strong>,<br /><br />
                {{message}}
              </td>
            </tr>

            <tr>
              <td align="center">
                <a
                  href="{{url}}"
                  style="
                    background: #007bff;
                    color: #fff;
                    padding: 12px 25px;
                    text-decoration: none;
                    border-radius: 6px;
                  "
                >
                  View Details
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
