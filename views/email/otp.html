<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OTP Verification</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 0">
      <tr>
        <td align="center">
          <table
            width="420"
            style="
              background: #ffffff;
              border-radius: 10px;
              padding: 30px;
              box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            "
          >
            <tr>
              <td align="center">
                <h2 style="margin: 0; color: #333">🔐 OTP Verification</h2>
              </td>
            </tr>

            <tr>
              <td style="padding: 20px 0; color: #555">
                Hello <strong>{{name}}</strong>,<br /><br />
                Use the OTP below to continue:
              </td>
            </tr>

            <tr>
              <td align="center">
                <div
                  style="
                    font-size: 32px;
                    font-weight: bold;
                    letter-spacing: 6px;
                    background: #f1f3f5;
                    padding: 15px 20px;
                    border-radius: 8px;
                  "
                >
                  {{otp}}
                </div>
              </td>
            </tr>

            <tr>
              <td style="padding: 20px 0; font-size: 14px; color: #888">
                This OTP is valid for 5 minutes. Do not share it with anyone.
              </td>
            </tr>

            <tr>
              <td align="center" style="font-size: 12px; color: #aaa">
                © 2026 Thryvoo. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
